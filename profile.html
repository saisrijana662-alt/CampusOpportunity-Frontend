<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CampusOpportunity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div class="card form-card form-wide">
        <h2 class="page-title">My Profile</h2>
        <p class="page-sub">Keep your profile updated – eligibility is checked using these details.</p>
        <div id="msg" class="message"></div>
        <div class="form-row">
            <div class="form-group"><label for="name">Name</label><input type="text" id="name"></div>
            <div class="form-group"><label for="email">Email (cannot be changed)</label><input type="email" id="email" readonly></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label for="branch">Branch</label><select id="branch"></select></div>
            <div class="form-group"><label for="cgpa">CGPA</label><input type="number" id="cgpa" step="0.01" min="0" max="10"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label for="graduationYear">Graduation Year</label><input type="number" id="graduationYear"></div>
            <div class="form-group"><label for="backlogs">Backlogs</label><input type="number" id="backlogs" min="0"></div>
        </div>
        <div class="form-group"><label for="skills">Skills</label><input type="text" id="skills" placeholder="Java, SQL, HTML">
            <div class="hint">Separate skills with commas</div></div>
        <div class="form-group"><label for="interests">Interests</label><input type="text" id="interests"></div>
        <button class="btn btn-primary" onclick="updateProfile()">Update Profile</button>
    </div>
</div>
<footer>CampusOpportunity – College Project • All opportunities shown are fictional demo data</footer>
<script src="script.js"></script>
<script>
    const student = requireLogin();
    renderNavbar("profile.html");
    fillBranchSelect("branch", "-- Select branch --");

    async function loadProfile() {
        try {
            // get the latest data from the server (and refresh localStorage)
            const s = await apiRequest("/students/" + student.id);
            saveStudent(s);
            document.getElementById("name").value = s.name || "";
            document.getElementById("email").value = s.email || "";
            document.getElementById("branch").value = s.branch || "";
            document.getElementById("cgpa").value = s.cgpa ?? "";
            document.getElementById("graduationYear").value = s.graduationYear ?? "";
            document.getElementById("backlogs").value = s.backlogs ?? 0;
            document.getElementById("skills").value = s.skills || "";
            document.getElementById("interests").value = s.interests || "";
        } catch (e) {
            showMessage("msg", e.message);
        }
    }

    async function updateProfile() {
        hideMessage("msg");
        const data = {
            name: document.getElementById("name").value.trim(),
            branch: document.getElementById("branch").value,
            cgpa: parseFloat(document.getElementById("cgpa").value) || 0,
            graduationYear: parseInt(document.getElementById("graduationYear").value) || null,
            skills: document.getElementById("skills").value.trim(),
            interests: document.getElementById("interests").value.trim(),
            backlogs: parseInt(document.getElementById("backlogs").value) || 0
        };
        if (!data.name) { showMessage("msg", "Name cannot be empty"); return; }
        try {
            const updated = await apiRequest("/students/" + student.id, "PUT", data);
            saveStudent(updated);
            showMessage("msg", "Profile updated successfully!", "success");
        } catch (e) {
            showMessage("msg", e.message);
        }
    }

    if (student) loadProfile();
</script>
</body>
</html>
